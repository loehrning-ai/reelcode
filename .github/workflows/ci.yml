name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Install node dependencies
        run: npm ci

      - name: reelcode setup (venv, Chromium with system deps, fixture media)
        run: npx reelcode setup --with-deps --python "$(command -v python3.12 || command -v python3)"

      - name: Tests (node and Python)
        run: npx reelcode test

      - name: Draft render of the smoke template
        run: |
          npx reelcode make _smoke --quality draft --formats 9x16 --no-stills
          ffprobe -v error -count_frames -show_entries stream=codec_type,width,height,nb_read_frames -of csv=p=0 projects/_smoke/out/9x16/draft.mp4

      - name: README quickstart (every format of the showreel, with sound and critique sheets)
        run: |
          npx reelcode make example-showreel
          for f in 9x16 1x1 4x5 16x9; do
            test -s "projects/example-showreel/out/$f/draft.mp4"
            ffprobe -v error -show_entries stream=codec_type,width,height -of csv=p=0 "projects/example-showreel/out/$f/draft.mp4"
          done
